name: "Tag and build"
on:
  push:
    branches: ["master"]
    tags: ["*"]
permissions:
  contents: read
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@21c0493ecfd34b1217f0a90ec19a327f3cc0a048 # v3.1.1
    - uses: pre-commit/action@9b88afc9cd57fd75b655d5c71bd38146d07135fe # v2.0.3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
  tagging:
    name: "Tagging"
    needs: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      next_tag: ${{ steps.tag_version.outputs.new_version }}
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
        with:
          persist-credentials: false
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@4c5d8c555a7cc4dca5e65d90b67dcddbb52ef77e # v5.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "Calculated Next Tag is $NEW_TAG"
        env:
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}

  post_slack:
    runs-on: ubuntu-latest
    needs: tagging
    permissions:
      contents: read
    steps:
      - name: Post to a Slack channel
        if: ${{ success() }}
        id: slack_success
        uses: slackapi/slack-github-action@d5d276d7ae0f38f29322b80da9baf985cc80f8b1 # v1.15.0
        with:
          channel-id: 'sdcadmin-operator'
          slack-message: ':cool-doge: `${{github.repository}}` new version: ${{needs.tagging.outputs.next_tag}}'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
